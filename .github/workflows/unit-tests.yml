name: Android Unit Tests

# делаем запуск для всех веток
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  unit-tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Provide permissions to gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Generate timestamp
        run: echo "FILE_TIME=$(date +'%H%M%S_%d%m%Y')" >> $GITHUB_ENV

      - name: Save tests result report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-report-${{ env.FILE_TIME }}
          path: app/build/reports/tests/